<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 BHK Flat for Rent – Bhopal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* TOP BAR */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,15,0.85); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #222;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: #fff; }
    .topbar-price { font-size: 14px; color: #f59e0b; font-weight: 700; }

    /* MAIN PHOTO */
    .main-photo-wrap {
      width: 100%; aspect-ratio: 16/9; overflow: hidden; cursor: pointer; position: relative; background: #1a1a1a;
    }
    .main-photo-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .main-photo-wrap:hover img { transform: scale(1.03); }
    .photo-label {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      color: #fff; font-size: 13px; padding: 5px 12px; border-radius: 20px;
    }
    .photo-counter {
      position: absolute; bottom: 14px; right: 14px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      color: #aaa; font-size: 12px; padding: 5px 12px; border-radius: 20px;
    }

    /* THUMBS */
    .thumbs {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
      background: #0f0f0f; padding: 3px 0;
    }
    .thumb {
      cursor: pointer; overflow: hidden; aspect-ratio: 1; background: #1a1a1a;
      border-bottom: 2px solid transparent; transition: border-color 0.2s;
    }
    .thumb.active { border-color: #f59e0b; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
    .thumb:hover img { opacity: 0.75; }

    /* VIDEO SECTION */
    .section { padding: 28px 20px; border-top: 1px solid #1e1e1e; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 14px; }
    .video-wrap {
      width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
      background: #1a1a1a;
    }
    .video-wrap video, .video-wrap iframe {
      width: 100%; height: 100%; display: block; border: none; border-radius: 12px;
    }
    /* placeholder if no video */
    .video-placeholder {
      width: 100%; aspect-ratio: 16/9; border-radius: 12px;
      background: #1a1a1a; border: 1px dashed #333;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #444; gap: 8px; font-size: 14px;
    }
    .video-placeholder span { font-size: 36px; }

    /* MAP */
    .map-wrap { border-radius: 12px; overflow: hidden; height: 220px; }
    .map-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

    /* WHATSAPP BUTTON */
    .wa-section { padding: 20px; position: sticky; bottom: 0; background: rgba(15,15,15,0.9); backdrop-filter: blur(12px); border-top: 1px solid #222; }
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #25D366; color: #000;
      font-size: 16px; font-weight: 700;
      padding: 15px; border-radius: 14px;
      text-decoration: none; letter-spacing: 0.3px;
      transition: all 0.2s;
    }
    .wa-btn:hover { background: #1ebe5a; transform: scale(1.01); }
    .wa-btn svg { width: 22px; height: 22px; fill: #000; flex-shrink: 0; }
    .wa-sub { text-align: center; font-size: 12px; color: #555; margin-top: 8px; }

    /* LIGHTBOX */
    .lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 999; align-items: center; justify-content: center; }
    .lb.open { display: flex; }
    .lb img { max-width: 96vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .lb-close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 28px; background: rgba(255,255,255,0.1); border: none; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 32px; background: rgba(255,255,255,0.08); border: none; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-nav:hover, .lb-close:hover { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">2 BHK · Amaltas Society, Bhopal</div>
  <div class="topbar-price">₹13,000/mo</div>
</div>

<!-- MAIN PHOTO -->
<div class="main-photo-wrap" onclick="openLb(currentIdx)" id="mainWrap">
  <img id="mainImg" src="images/front.jpeg" alt="" />
  <div class="photo-label" id="mainLabel">🏠 Front View</div>
  <div class="photo-counter" id="mainCount">1 / 10</div>
</div>

<!-- THUMBS -->
<div class="thumbs">
  <div class="thumb active" onclick="setPhoto(0,this)"><img src="images/front.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(1,this)"><img src="images/building_view.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(2,this)"><img src="images/straight_view.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(3,this)"><img src="images/view_from_front_ddoor.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(4,this)"><img src="images/corner_side_flat.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(5,this)"><img src="images/bedroom.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(6,this)"><img src="images/kitchen.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(7,this)"><img src="images/bathroom.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(8,this)"><img src="images/back view balcony1.jpeg" /></div>
  <div class="thumb" onclick="setPhoto(9,this)"><img src="images/backside_balcony_space.jpeg" /></div>
</div>

<!-- VIDEO -->
<div class="section">
  <div class="section-title">Video</div>
  <div class="video-wrap">
    <!--
      Option A – local video file:
      <video controls poster="images/front.jpeg">
        <source src="video/flat_tour.mp4" type="video/mp4" />
      </video>

      Option B – YouTube embed (replace VIDEO_ID):
      <iframe src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen></iframe>
    -->
    <video controls poster="images/front.jpeg" style="width:100%;height:100%;border-radius:12px;">
      <source src="https://raw.githubusercontent.com/rrahulyada/mera-flat/main/WhatsApp%20Video%202026-06-16%20at%203.11.54%20PM.mp4" type="video/mp4" />
    </video>
  </div>
</div>

<!-- LOCATION -->
<div class="section">
  <div class="section-title">Location</div>
  <div class="map-wrap">
    <iframe src="https://maps.google.com/maps?q=Amaltas%20Housing%20Society,%20Bhopal&t=&z=16&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
  </div>
</div>

<!-- WHATSAPP -->
<div class="wa-section">
  <a class="wa-btn" href="https://wa.me/916263723598?text=Hello%20Anish%20ji%2C%20mujhe%202%20BHK%20flat%20ke%20baare%20mein%20jaankari%20chahiye%20Amaltas%20Society%20Bhopal%20mein.">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.845L0 24l6.335-1.508A11.955 11.955 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 0 1-5.007-1.368l-.359-.213-3.76.985.998-3.658-.234-.374A9.818 9.818 0 0 1 2.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
    WhatsApp – Anish Yadav
  </a>
  <div class="wa-sub">6263723598 · 2 BHK · ₹13,000/mo</div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lbImg" src="" />
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
</div>

<script>
var photos = [
  { src: "images/front.jpeg",                  label: "🏠 Front View" },
  { src: "images/building_view.jpeg",           label: "🏙️ Building View" },
  { src: "images/straight_view.jpeg",           label: "👁️ Straight View" },
  { src: "images/view_from_front_ddoor.jpeg",   label: "🚪 Front Door View" },
  { src: "images/corner_side_flat.jpeg",        label: "📐 Corner Side" },
  { src: "images/bedroom.jpeg",                 label: "🛏️ Bedroom" },
  { src: "images/kitchen.jpeg",                 label: "🍳 Kitchen" },
  { src: "images/bathroom.jpeg",                label: "🚿 Bathroom" },
  { src: "images/back view balcony1.jpeg",      label: "🌅 Balcony View" },
  { src: "images/backside_balcony_space.jpeg",  label: "🌅 Balcony Space" }
];

var currentIdx = 0;

function setPhoto(idx, el) {
  currentIdx = idx;
  document.getElementById('mainImg').src = photos[idx].src;
  document.getElementById('mainLabel').textContent = photos[idx].label;
  document.getElementById('mainCount').textContent = (idx+1) + ' / ' + photos.length;
  document.querySelectorAll('.thumb').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
}

function openLb(idx) {
  currentIdx = idx;
  document.getElementById('lbImg').src = photos[idx].src;
  document.getElementById('lb').classList.add('open');
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
function lbNav(d) {
  currentIdx = (currentIdx + d + photos.length) % photos.length;
  document.getElementById('lbImg').src = photos[currentIdx].src;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowRight') lbNav(1);
  if(e.key==='ArrowLeft') lbNav(-1);
});
</script>
</body>
</html>
